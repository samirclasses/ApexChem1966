
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Social Media Posts</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f6;
            color: #263238;
        }

        header {
            background: linear-gradient(135deg, #176b5b, #48a999);
            color: white;
            text-align: center;
            padding: 35px 15px;
        }

        header h1 {
            margin: 0 0 10px;
            font-size: 30px;
        }

        header p {
            margin: 0;
            font-size: 16px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 22px;
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .post {
            background: white;
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #00000015;
            transition: transform 0.25s;
        }

        .post:hover {
            transform: translateY(-5px);
        }

        .post img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
            cursor: pointer;
        }

        footer {
            text-align: center;
            padding: 20px;
            background: #e4eeeb;
            color: #52645f;
        }

        /* Full-screen image viewer */
        #viewer {
            display: none;
            position: fixed;
            inset: 0;
            background: #000000eF;
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #viewer img {
            max-width: 95%;
            max-height: 90vh;
            object-fit: contain;
        }

        #close {
            position: absolute;
            top: 15px;
            right: 25px;
            color: white;
            font-size: 38px;
            cursor: pointer;
        }

        @media (max-width: 500px) {
            header h1 {
                font-size: 24px;
            }

            .gallery {
                grid-template-columns: 1fr;
                padding: 0 15px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>My Social Media Posts</h1>
        <p>Chemistry • Science • Thoughts • Creativity</p>
    </header>

    <main class="gallery">

        <div class="post">
            <img src="" alt="Post 1" onclick="openImage(this)">
        </div>

        <div class="post">
            <img src="" alt="Post 2" onclick="openImage(this)">
        </div>

        <div class="post">
            <img src="" alt="Post 3" onclick="openImage(this)">
        </div>

        <div class="post">
            <img src="" alt="Post 4" onclick="openImage(this)">
        </div>

        <div class="post">
            <img src="" alt="Post 5" onclick="openImage(this)">
        </div>

        <div class="post">
            <img src="" alt="Post 6" onclick="openImage(this)">
        </div>

    </main>

    <div id="viewer" onclick="closeImage()">
        <span id="close">&times;</span>
        <img id="largeImage" src="" alt="Enlarged post">
    </div>

    <footer>
        <p>My Posts | Sharing Knowledge and Ideas</p>
    </footer>

    <script>
        function openImage(img) {
            if (!img.src || !img.getAttribute("src")) return;

            document.getElementById("largeImage").src = img.src;
            document.getElementById("viewer").style.display = "flex";
        }

        function closeImage() {
            document.getElementById("viewer").style.display = "none";
        }

        document.addEventListener("keydown", function(event) {
            if (event.key === "Escape") {
                closeImage();
            }
        });
    </script>

</body>
</html>
